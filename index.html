<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz สุขศึกษา ม.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="images/logo.png" alt="โลโก้" class="logo">
    <div id="quiz-container">
      <div id="question"></div>
      <div id="options"></div>
      <div id="controls">
        <button id="next-btn">คำถามถัดไป</button>
      </div>
      <div id="score-container"></div>
      <div id="timer"></div>
    </div>
  </div>

  <audio id="correct-sound" src="sounds/correct.mp3"></audio>
  <audio id="wrong-sound" src="sounds/wrong.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
